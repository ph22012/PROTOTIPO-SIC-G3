{% extends 'layouts/base.html' %}
{% load static %}
{% block content %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyectos</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <div class="row">
            {% for proyecto in proyectos %}
                <div class="col-md-6 mb-4">
                    <a href="{% url 'proyecto_detalle' proyecto.id %}" style="text-decoration: none; color: inherit;">
                        <div class="card h-100">
                            <div class="card-body">
                                <h5 class="card-title text-center">{{ proyecto.nombre }}</h5>
                                <img src="{% static 'icons/' %}{{ proyecto.imagen }}" class="card-img-top mb-3 mx-auto d-block" alt="Imagen Proyecto" style="max-width: 150px; height: auto;">
                                <p class="card-text text-justify">{{ proyecto.descripcion }}</p>
                                <a href="{% url 'proyecto_detalle' proyecto.id %}" class="btn btn-primary float-right mt-4">Ver Detalles</a>
                            </div>
                        </div>
                    </a>
                </div>
            {% endfor %}
        </div>
    </div>    
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
{% endblock %}
