{% extends 'layouts/base.html' %}

{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Transacción</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-body">
                <h2 class="text-center mb-4">Registrar Transacción</h2>
                {% if messages %}
                    <div class="container mt-3">
                        {% for message in messages %}
                            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert" id="auto-dismiss">
                                {{ message }}
                            </div>
                        {% endfor %}
                    </div>
                {% endif %}
                <form method="post" action="">
                    {% csrf_token %}
                    
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="fecha">Fecha:</label>
                            <input type="date" name="fecha" id="fecha" class="form-control" required>
                        </div>
                        <div class="form-group col-md-6">
                            <label for="descripcion">Descripción:</label>
                            <input type="text" name="descripcion" id="descripcion" class="form-control" required>
                        </div>
                    </div>
                    
                    <h4 class="mt-4">Saldos</h4>
                    <div id="saldos-container">
                        <div class="form-row align-items-center mb-2 saldo-item">
                            <div class="col-md-4">
                                <select name="idCuenta" class="form-control" required>
                                    {% for cuenta in cuentas %}
                                        <option value="{{ cuenta.idCuenta }}">{{ cuenta.nameCuenta }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-4">
                                <input type="number" name="monto" class="form-control" placeholder="Monto" required>
                            </div>
                            <div class="col-md-4">
                                <select name="tipo" class="form-control" required>
                                    <option value="cargo">Cargo</option>
                                    <option value="haber">Haber</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <button type="button" id="add-saldo" class="btn btn-outline-secondary">Agregar Saldo</button>
                        <button type="submit" class="btn btn-primary">Guardar Transacción</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('add-saldo').onclick = function() {
            const container = document.getElementById('saldos-container');
            const newSaldo = `
                <div class="form-row align-items-center mb-2 saldo-item">
                    <div class="col-md-4">
                        <select name="idCuenta" class="form-control" required>
                            {% for cuenta in cuentas %}
                                <option value="{{ cuenta.idCuenta }}">{{ cuenta.nameCuenta }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-4">
                        <input type="number" name="monto" class="form-control" placeholder="Monto" required>
                    </div>
                    <div class="col-md-4">
                        <select name="tipo" class="form-control" required>
                            <option value="cargo">Cargo</option>
                            <option value="haber">Haber</option>
                        </select>
                    </div>
                </div>`;
            container.insertAdjacentHTML('beforeend', newSaldo);
        }
        setTimeout(function() {
            const alert = document.getElementById('auto-dismiss');
            if (alert) {
                alert.classList.remove('show');
                alert.classList.add('fade');
                setTimeout(() => alert.remove(), 150);
            }
        }, 3000); 
    </script>
</body>
</html>
{% endblock %}
