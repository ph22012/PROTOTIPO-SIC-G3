{% extends 'layouts/base.html' %}

{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Transacción</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <div class="d-flex justify-content-center align-items-center flex-column">
            <h2 class="text-center">Registrar Transacción</h2>
            
            <form method="post" action="">
                {% csrf_token %}
                {{ form.as_p }}
                <div id="saldos-container" class="w-100">
                    <h4>Saldos</h4>
                    <div class="input-group mb-3 saldo-item">
                        <select name="idCuenta" class="form-control" required>
                            {% for cuenta in cuentas %}
                                <option value="{{ cuenta.idCuenta }}">{{ cuenta.nameCuenta }}</option>
                            {% endfor %}
                        </select>
                        <input type="number" name="monto" class="form-control" placeholder="Monto" required>
                        <select name="tipo" class="form-control" required>
                            <option value="cargo">Cargo</option>
                            <option value="haber">Haber</option>
                        </select>
                        <input type="date" name="fecha" class="form-control" required>
                    </div>
                </div>
                <button type="button" id="add-saldo" class="btn btn-secondary mb-3">Agregar Saldo</button>
                <button type="submit" class="btn btn-primary">Guardar Transacción</button>
            </form>
        </div>

        <script>
            document.getElementById('add-saldo').onclick = function() {
                const container = document.getElementById('saldos-container');
                const newSaldo = `<div class="input-group mb-3 saldo-item">
                    <select name="idCuenta" class="form-control" required>
                        {% for cuenta in cuentas %}
                            <option value="{{ cuenta.idCuenta }}">{{ cuenta.nameCuenta }}</option>
                        {% endfor %}
                    </select>
                    <input type="number" name="monto" class="form-control" placeholder="Monto" required>
                    <select name="tipo" class="form-control" required>
                        <option value="cargo">Cargo</option>
                        <option value="haber">Haber</option>
                    </select>
                    <input type="date" name="fecha" class="form-control" required>
                </div>`;
                container.insertAdjacentHTML('beforeend', newSaldo);
            }
        </script>
    </div>
</body>
</html>
{% endblock %}
