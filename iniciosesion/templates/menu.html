{% extends 'layouts/base.html' %}
{% load static %}
{% block content %}

<div class="container mt-5">
    <div class="row justify-content-center">

        <!-- Card 1: Contabilidad General -->
        <div class="col-lg-4 col-md-6 mb-4">
            <a href="{% url 'create_transaction' %}" style="text-decoration: none; color: inherit;">
                <div class="card h-100 p-4">
                    <div class="card-body text-center">
                        <h5 class="card-title">Contabilidad General</h5>
                        <img src="{% static 'icons/CONTAGENERAL.png' %}" class="card-img-top mb-3" alt="Contabilidad General" style="width: 200px; height: 200px;">
                        <p class="card-text">Acceso a la gestión de la contabilidad general de la empresa</p>
                    </div>
                </div>
            </a>
        </div>

        <!-- Card 2: Contabilidad de Costo -->
        <div class="col-lg-4 col-md-6 mb-4">
            <a href="{% url 'proyectos' %}" style="text-decoration: none; color: inherit;">
                <div class="card h-100 p-4">
                    <div class="card-body text-center">
                        <h5 class="card-title">Contabilidad de Costo</h5>
                        <img src="{% static 'icons/CONTACOSTOS.png' %}" class="card-img-top mb-3" alt="Contabilidad de Costo" style="width: 200px; height: 200px;">
                        <p class="card-text">Acceso a la sección para calcular los costos</p>
                    </div>
                </div>
            </a>
        </div>

    </div>
</div>

{% endblock %}
